[package]
name = "canto-crypto"
version = "0.1.0"
edition = "2021"
description = "Canto cryptographic core: key derivation, authenticated encryption, streaming file encryption, TOTP, encrypted vault"

[dependencies]
argon2 = "0.5"
chacha20poly1305 = "0.10"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
rand = "0.8"
zeroize = "1"
base32 = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
